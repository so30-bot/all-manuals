name: Weekly Parser

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weekly parser
        run: npm run parser:weekly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PARSER_MIN_SOURCES: '3'
          PARSER_PUBLISH_THRESHOLD: '0.72'
          PARSER_ALLOW_LICENSED_IMAGES: 'false'

      - name: Build after parser
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://all-manuals.ru
          PUBLIC_CONTACT_EMAIL: dmca@all-manuals.ru

      - name: Commit generated content
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "all-manuals-bot"
          git config user.email "bot@all-manuals.ru"
          git add src/content/errors public/images/errors src/data
          git commit -m "update weekly error solutions"
          git push
