name: Auto Parser (every 6h)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      query_limit:
        description: 'How many queries to process'
        required: false
        default: '500'
      query_offset:
        description: 'Catalog offset for batch runs'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  parse-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run parser
        run: npm run parser:weekly
        env:
          AI_PROVIDER: 'gemini'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          PARSER_MIN_SOURCES: '2'
          PARSER_PUBLISH_THRESHOLD: '0.30'
          PARSER_QUERY_LIMIT: ${{ github.event.inputs.query_limit || '50' }}
          PARSER_QUERY_OFFSET: ${{ github.event.inputs.query_offset || '' }}
          PARSER_ALLOW_LICENSED_IMAGES: 'false'
          AI_TIMEOUT_MS: '120000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://all-manuals.ru
          PUBLIC_CONTACT_EMAIL: dmca@all-manuals.ru

      - name: Commit and push
        run: |
          git config user.name "all-manuals-bot"
          git config user.email "bot@all-manuals.ru"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No new articles."
            exit 0
          fi
          git add src/content/errors/
          git commit -m "auto: generate error articles [skip ci]"
          git push
